#model
model_name: lora
device: cuda:0
checkpoint: ./model_ckp/lora/lora_splits_S_chunked_max_fold1.pt

#data
train_path: /home/samo/repos/phossil/data/phosf3c/dbptm/splits_S_chunked_max_fold1/train.fasta
test_path: /home/samo/repos/phossil/data/phosf3c/dbptm/splits_S_chunked_max_fold1/test.fasta
predict_path: /home/samo/repos/phossil/data/phosf3c/dbptm/splits_S_chunked_max_fold1/test.fasta
type: ['S']

#train
patience_limit: 5
patience_key: auc
num_epoch: 10
batch: 64
window_size: 15
split: 0.2000

#opt
lr: 1e-4
beta1: 0.9
beta2: 0.999
weight_decay: 1e-4

#log & save
val_interval: 500
threshold: 0.5
log_path: ./log/lora
log_name: lora_splits_S_chunked_max_fold1
save_path: ./model_ckp/lora
save_name: lora_splits_S_chunked_max_fold1
predict_result_path: ./result/lora
