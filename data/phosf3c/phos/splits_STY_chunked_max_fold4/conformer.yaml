#model
model_name: conformer
device: cuda:0
conformer_checkpoint: ./model_ckp/conformer/conformer_splits_STY_chunked_max_fold4.pt
lora_checkpoint: ./model_ckp/lora/lora_splits_STY_chunked_max_fold4.pt
alpha: 0.5

#data
train_path: /home/samo/repos/phossil/data/phosf3c/phos/splits_STY_chunked_max_fold4/train.fasta
test_path: /home/samo/repos/phossil/data/phosf3c/phos/splits_STY_chunked_max_fold4/test.fasta
predict_path: /home/samo/repos/phossil/data/phosf3c/phos/splits_STY_chunked_max_fold4/test.fasta
type: ['S', 'T', 'Y']

#train
patience_limit: 5
patience_key: auc
num_epoch: 10
batch: 64
window_size: 15
split: 0.2000

#opt
lr: 5e-5
beta1: 0.9
beta2: 0.999
weight_decay: 1e-4

#log & save
val_interval: 500
threshold: 0.5
log_path: ./log/conformer
log_name: conformer_splits_STY_chunked_max_fold4
save_path: ./model_ckp/conformer
save_name: conformer_splits_STY_chunked_max_fold4
predict_result_path: ./result/conformer
