#model
model_name: conformer
device: cuda:0
conformer_checkpoint: ./model_ckp/conformer/conformer_splits_T_chunked_max_fold0.pt
lora_checkpoint: ./model_ckp/lora/lora_splits_T_chunked_max_fold0.pt
alpha: 0.5

#data
train_path: ../data/phosf3c/phos/splits_T_chunked_max_fold0/train.fasta
test_path: ../data/phosf3c/phos/splits_T_chunked_max_fold0/test.fasta
predict_path: ../data/phosf3c/phos/splits_T_chunked_max_fold0/test.fasta
type: ['T']

#train
patience_limit: 5
patience_key: auc
num_epoch: 10
batch: 64
window_size: 15
split: 0.2002

#opt
lr: 5e-5
beta1: 0.9
beta2: 0.999
weight_decay: 1e-4

#log & save
val_interval: 500
threshold: 0.5
log_path: ./log/conformer
log_name: conformer_splits_T_chunked_max_fold0
save_path: ./model_ckp/conformer
save_name: conformer_splits_T_chunked_max_fold0
predict_result_path: ./result/conformer
