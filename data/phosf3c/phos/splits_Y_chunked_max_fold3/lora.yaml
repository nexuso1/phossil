#model
model_name: lora
device: cuda:0
checkpoint: ./model_ckp/lora/lora_splits_Y_chunked_max_fold3.pt

#data
train_path: ../data/phosf3c/phos/splits_Y_chunked_max_fold3/train.fasta
test_path: ../data/phosf3c/phos/splits_Y_chunked_max_fold3/test.fasta
predict_path: ../data/phosf3c/phos/splits_Y_chunked_max_fold3/test.fasta
type: ['Y']

#train
patience_limit: 5
patience_key: auc
num_epoch: 10
batch: 64
window_size: 15
split: 0.2001

#opt
lr: 1e-4
beta1: 0.9
beta2: 0.999
weight_decay: 1e-4

#log & save
val_interval: 500
threshold: 0.5
log_path: ./log/lora
log_name: lora_splits_Y_chunked_max_fold3
save_path: ./model_ckp/lora
save_name: lora_splits_Y_chunked_max_fold3
predict_result_path: ./result/lora
